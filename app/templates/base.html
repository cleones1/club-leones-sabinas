<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00338D"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/icon-192.png"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/style-v2.css"><title>{% block title %}Club de Leones de Sabinas{% endblock %}</title></head><body>
