name: Security hardening smoke test

on:
  push:
    branches: [security-hardening-2026-11-01]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: test-only-session-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: sqlite:///./security-smoke.db
      ADMIN_EMAIL: security-admin@example.com
      ADMIN_PASSWORD: TestSecurityPassword-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install httpx2 pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q app
      - name: Application smoke tests
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app, base_url="https://club-leones-sabinas.onrender.com") as client:
              assert client.get("/health").status_code == 200
              home = client.get("/")
              assert home.status_code == 200
              assert home.headers.get("x-frame-options") == "DENY"
              assert home.headers.get("x-content-type-options") == "nosniff"
              assert "content-security-policy" in home.headers

              bad = client.post(
                  "/login",
                  data={"email": "nobody@example.com", "password": "incorrect-password"},
                  headers={"Origin": "https://club-leones-sabinas.onrender.com"},
              )
              assert bad.status_code == 400

              csrf = client.post(
                  "/login",
                  data={"email": "nobody@example.com", "password": "incorrect-password"},
                  headers={"Origin": "https://evil.example"},
              )
              assert csrf.status_code == 403

              assert client.get("/docs").status_code == 404
              assert client.get("/openapi.json").status_code == 404

              login = client.post(
                  "/login",
                  data={"email": "security-admin@example.com", "password": "TestSecurityPassword-2026!"},
                  headers={"Origin": "https://club-leones-sabinas.onrender.com"},
                  follow_redirects=False,
              )
              assert login.status_code == 303
              for path in (
                  "/admin",
                  "/admin/configuracion",
                  "/admin/precios",
                  "/admin/corte-dia",
                  "/admin/rentas-publico",
                  "/admin/importar-socios",
                  "/admin/correccion-pagos",
              ):
                  response = client.get(path)
                  assert response.status_code == 200, (path, response.status_code)
          PY
