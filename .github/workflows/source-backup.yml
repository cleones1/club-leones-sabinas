name: Temporary source backup export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-backup.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5912a43fcce932690dd5a7018b839d812ea6d6c9
      - name: Prepare exact source snapshot
        shell: bash
        run: |
          rm -rf .git
          zip -r Club_Leones_Sabinas_Source_5912a43f.zip .             -x 'Club_Leones_Sabinas_Source_5912a43f.zip'
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: club-leones-source-5912a43f
          path: Club_Leones_Sabinas_Source_5912a43f.zip
          retention-days: 1
          if-no-files-found: error
