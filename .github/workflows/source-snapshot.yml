name: Snapshot source backup

on:
  push:
    branches: [backup-2026-10-05]
    paths:
      - '.github/workflows/source-snapshot.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c22f574b70e96a17fb89e42a3fd6c49a8f7b368
      - name: Package exact production source
        shell: bash
        run: |
          rm -rf .git
          zip -r Club_Leones_Sabinas_Source_0c22f574.zip .             -x 'Club_Leones_Sabinas_Source_0c22f574.zip'
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: club-leones-source-0c22f574
          path: Club_Leones_Sabinas_Source_0c22f574.zip
          retention-days: 1
          if-no-files-found: error
