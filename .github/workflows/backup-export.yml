name: Temporary encrypted DB backup export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted database backup
        shell: bash
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 90 \
              "https://club-leones-sabinas.onrender.com/internal/encrypted-db-backup" \
              --output club-leones-db-backup.enc; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          test -s club-leones-db-backup.enc
      - name: Commit encrypted payload temporarily
        shell: bash
        run: |
          set -e
          base64 -w 0 club-leones-db-backup.enc > .temporary-db-backup.enc.b64
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add .temporary-db-backup.enc.b64
          git commit -m "Temporary encrypted database backup payload [skip ci]"
          git push
