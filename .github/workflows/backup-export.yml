name: Temporary encrypted DB backup export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted database backup
        shell: bash
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 90 \
              "https://club-leones-sabinas.onrender.com/internal/encrypted-db-backup" \
              --output club-leones-db-backup.enc; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          test -s club-leones-db-backup.enc
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-db-backup-2026-09-23
          path: club-leones-db-backup.enc
          retention-days: 1
          if-no-files-found: error
